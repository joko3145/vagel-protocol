<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagal Research Control Panel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; width: 420px; }
        h1 { color: #1d1d1f; font-size: 22px; margin-bottom: 5px; }
        p { color: #86868b; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
        .btn { background: #0071e3; color: white; border: none; padding: 14px 28px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; margin-bottom: 12px; }
        .btn:hover { background: #0077ed; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #d2d2d7; color: #86868b; cursor: not-allowed; }
        .btn-stop { background: #ff3b30; }
        .btn-stop:hover { background: #ff453a; }
        #status-box { margin-top: 15px; padding: 12px; border-radius: 10px; font-weight: bold; background: #f5f5f7; color: #1d1d1f; font-size: 14px; }
        #log-window { margin-top: 15px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #333; background: #fafafa; border: 1px solid #e5e5ea; border-radius: 8px; padding: 10px; text-align: left; }
    </style>
</head>
<body>
<div class="card">
    <h1>tVNS Protocol Controller</h1>
    <p>Research Variant: 0.5s ON / 10s OFF (30 Min Total)</p>
    <button id="connect-btn" class="btn">1. Connect Stimulator</button>
    <button id="start-btn" class="btn" disabled>2. Start Session</button>
    <button id="stop-btn" class="btn btn-stop" style="display:none;">Stop Stimulation</button>
    <div id="status-box">Status: Disconnected</div>
    <div id="log-window">Ready. Turn device ON to the 15-min idle screen, then click Connect.</div>
</div>
<script>
    const BURST_DURATION_MS = 500;
    const REST_DURATION_MS = 10000;
    const TOTAL_SESSION_MINUTES = 30;
    const CUSTOM_SERVICES = [
        '0000aab0-a33e-4631-bb30-9013ad9ebc56',
        '0000aae0-a33e-4631-bb30-9013ad9ebc56',
        '00001825-0000-1000-8000-00805f9b34fb',
        0x180a, 0x180f
    ];
    let isLoopRunning = false;
    let controlCharacteristic = null;
    let activeDevice = null;
    let sessionTimeoutHandle = null;
    let startTime = null;
    let wakeLock = null;
    let audioCtx = null;

    const statusBox = document.getElementById('status-box');
    const logWindow = document.getElementById('log-window');
    const connectBtn = document.getElementById('connect-btn');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');

    function log(msg) {
        logWindow.innerHTML = '[' + new Date().toLocaleTimeString() + '] ' + msg + '<br>' + logWindow.innerHTML;
    }

    function playCompletionChime() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = new Array(523.25, 659.25, 783.99);
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.22);
                gain.gain.setValueAtTime(0.001, audioCtx.currentTime + i * 0.22);
                gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + i * 0.22 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.22 + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.22);
                osc.stop(audioCtx.currentTime + i * 0.22 + 1.3);
            });
        } catch (e) {}
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                log('Screen Wake Lock active.');
            }
        } catch (err) {}
    }

    async function bindControlCharacteristic(server) {
        const services = await server.getPrimaryServices();
        for (let service of services) {
            if (service.uuid.includes('aab0') || service.uuid.includes('aae0')) {
                const chars = await service.getCharacteristics();
                for (let c of chars) {
                    if (c.properties.write || c.properties.writeWithoutResponse) {
                        controlCharacteristic = c;
                        return;
                    }
                }
            }
        }
        throw new Error('Control port unavailable.');
    }

    connectBtn.addEventListener('click', async () => {
        if (!navigator.bluetooth) {
            log('Error: Web Bluetooth is not supported in this browser. Open in Chrome or Edge.');
            return;
        }
        try {
            statusBox.innerText = 'Scanning...';
            activeDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: CUSTOM_SERVICES
            });
            statusBox.innerText = 'Connecting...';
            const server = await activeDevice.gatt.connect();
            await bindControlCharacteristic(server);
            log('Locked onto control port: ' + controlCharacteristic.uuid);
            statusBox.innerText = 'Connected & Ready';
            statusBox.style.background = '#e2f0d9';
            statusBox.style.color = '#385723';
            connectBtn.disabled = true;
            startBtn.disabled = false;
        } catch (error) {
            statusBox.innerText = 'Error Connecting';
            statusBox.style.background = '#fce4d6';
            statusBox.style.color = '#c65911';
            log('Fail: ' + error.message);
        }
    });

    async function safeWrite(byteArray) {
        let wasDisconnected = false;
        while (isLoopRunning) {
            try {
                if (!activeDevice.gatt.connected) {
                    wasDisconnected = true;
                    statusBox.innerText = 'Out of Range - Auto-Reconnecting...';
                    statusBox.style.background = '#fff2cc';
                    statusBox.style.color = '#7f6000';
                    const server = await activeDevice.gatt.connect();
                    await bindControlCharacteristic(server);
                }
                if (controlCharacteristic.properties.writeWithoutResponse) {
                    await controlCharacteristic.writeValueWithoutResponse(byteArray);
                } else {
                    await controlCharacteristic.writeValue(byteArray);
                }
                if (wasDisconnected) {
                    log('Back in range! Resuming protocol...');
                    statusBox.style.background = '#c9daf8';
                    statusBox.style.color = '#1c4587';
                }
                return true;
            } catch (err) {
                if (!wasDisconnected) {
                    log('Signal lost (out of range). Waiting to resume...');
                    wasDisconnected = true;
                }
                await new Promise(r => setTimeout(r, 1500));
            }
        }
    }

    startBtn.addEventListener('click', async () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isLoopRunning = true;
        startTime = Date.now();
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        statusBox.innerText = 'Session Active: 30:00';
        statusBox.style.background = '#c9daf8';
        statusBox.style.color = '#1c4587';

        await requestWakeLock();

        const totalSessionMs = TOTAL_SESSION_MINUTES * 60 * 1000;
        sessionTimeoutHandle = setTimeout(() => endSessionGracefully(), totalSessionMs);

        const START_BYTE = new Uint8Array([0x01]);
        const STOP_BYTE = new Uint8Array([0x00]);

        while (isLoopRunning) {
            try {
                let elapsedMs = Date.now() - startTime;
                let remainingMin = Math.max(0, Math.ceil((totalSessionMs - elapsedMs) / 60000));
                statusBox.innerText = 'Session Active: ~' + remainingMin + ' min left';

                await safeWrite(START_BYTE);
                if (!isLoopRunning) break;
                log('Burst Active (0.5s)...');
                await new Promise(r => setTimeout(r, BURST_DURATION_MS));
                if (!isLoopRunning) break;

                await safeWrite(STOP_BYTE);
                log('Rest Active (10s)...');
                for (let step = 0; step < 5; step++) {
                    if (!isLoopRunning) break;
                    await new Promise(r => setTimeout(r, 2000));
                    if (step < 4 && isLoopRunning) await safeWrite(STOP_BYTE);
                }
            } catch (e) {
                log('Error: ' + e.message);
                await new Promise(r => setTimeout(r, 1000));
            }
        }
    });

    async function endSessionGracefully() {
        isLoopRunning = false;
        clearTimeout(sessionTimeoutHandle);
        if (wakeLock) { try { await wakeLock.release(); wakeLock = null; } catch (e) {} }
        if (activeDevice && activeDevice.gatt.connected && controlCharacteristic) {
            try { await controlCharacteristic.writeValue(new Uint8Array([0x00])); } catch (e) {}
        }
        statusBox.innerText = 'Session Completed';
        statusBox.style.background = '#e2f0d9';
        statusBox.style.color = '#385723';

stopBtn.style.display = 'none';
playCompletionChime();
log('30-Minute limit reached. Chime played and stimulation stopped.');
}
stopBtn.addEventListener('click', async () => {
isLoopRunning = false;
clearTimeout(sessionTimeoutHandle);
if (wakeLock) { try { await wakeLock.release(); wakeLock = null; } catch (e) {} }
if (activeDevice && activeDevice.gatt.connected && controlCharacteristic) {
try { await controlCharacteristic.writeValue(new Uint8Array([0x00])); } catch (e) {}
}
statusBox.innerText = 'Aborted / Stopped';
statusBox.style.background = '#fce4d6';
statusBox.style.color = '#c65911';
stopBtn.style.display = 'none';
startBtn.style.display = 'block';
startBtn.disabled = false;
log('Stopped: Circuit forced off.');
});
</script>
</body>
</html>
